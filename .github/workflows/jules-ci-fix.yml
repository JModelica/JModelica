name: Jules — keep Actions green

# Jules owns the health of the Actions tab. When a workflow goes red, this hands
# the failure to Jules to diagnose and fix.
#
# The hard part is not triggering — it is triggering *once*. This repository's
# build is currently expected to fail, so a naive `on: workflow_run failure`
# would start a session on every push and drain the free tier's 15 daily tasks
# within the hour, most of them working on the same problem in parallel. Three
# guards prevent that:
#
#   1. Deduplication by commit. A commit whose failure has already been handed
#      over is never handed over again, however many workflows fail on it.
#   2. A daily budget. At most JULES_CI_FIX_DAILY_MAX handovers per rolling day
#      (default 3), counted from this workflow's own run history.
#   3. Open-work check. If Jules already has a pull request open against the
#      branch, it is already working; no second session is started.
#
# Set JULES_CI_FIX_ENABLED to 'false' to pause this entirely.

# The run title carries the commit under investigation. This is not cosmetic:
# guard 1 below reads it back. A workflow_run-triggered run is always attributed
# to the default branch — `headSha` in the run list is master's tip, never the
# commit that broke — so the run list cannot be used as a per-commit ledger
# unless the commit is written somewhere the API will return. `displayTitle` is
# that somewhere.
run-name: >-
  Jules — keep Actions green
  (${{ github.event.workflow_run.head_sha || inputs.run_id }})

on:
  workflow_run:
    workflows: ['CI', 'Container images', 'Release']
    types: [completed]
    branches: [master, 'feature/**']
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Workflow run ID to investigate'
        required: true
        type: string
      force:
        description: 'Ignore the deduplication and budget guards'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: jules-ci-fix-${{ github.event.workflow_run.head_branch || inputs.run_id }}
  cancel-in-progress: false

jobs:
  triage:
    if: >-
      vars.JULES_CI_FIX_ENABLED != 'false' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.guards.outputs.proceed }}
    steps:
      - name: Check the API key is configured
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          if [ -z "${JULES_API_KEY}" ]; then
            echo "::error::Secret JULES_API_KEY is not set. See doc/automation.md." >&2
            exit 1
          fi

      - name: Apply the guards
        id: guards
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          FORCE: ${{ inputs.force }}
          DAILY_MAX: ${{ vars.JULES_CI_FIX_DAILY_MAX || '3' }}
        run: |
          set -euo pipefail

          if [ "${FORCE}" = "true" ]; then
            echo "Guards bypassed by request."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          proceed=true
          reason=""

          # --- Guard 1: has this commit already been handed over? -------------
          # Runs of this very workflow are the ledger, so no external state is
          # needed. A commit that broke CI and Docker at once must not produce
          # two sessions solving the same thing.
          #
          # Read the commit out of `displayTitle`, which `run-name:` above fills
          # in. Matching on `headSha` was wrong and was: for a workflow_run
          # trigger GitHub attributes the run to the *default branch*, so every
          # row's headSha is master's tip and the comparison against the failing
          # commit never matched. The guard silently passed every time. It cost
          # three Jules sessions on 2026-09-07 — 12:25, 12:31 and 12:39 — for one
          # branch and one set of failures.
          #
          # Any conclusion except "skipped" counts as a handover. Matching only
          # on "success" is wrong too: a run that started a session and then
          # failed in a later bookkeeping step is recorded as a failure, the
          # guard does not see it, and the next trigger spends a second task on
          # the identical problem. A run is "skipped" only when this guard
          # already stopped it, which is the one case where no session started.
          if [ -n "${SHA:-}" ]; then
            seen=$(gh run list \
                     --workflow jules-ci-fix.yml \
                     --limit 60 \
                     --json displayTitle,databaseId,conclusion \
                     --jq "[.[] | select((.displayTitle | contains(\"${SHA}\")) and
                                         .databaseId != ${GITHUB_RUN_ID} and
                                         .conclusion != null and
                                         .conclusion != \"skipped\" and
                                         .conclusion != \"cancelled\")] | length" \
                   2>/dev/null || echo 0)
            if [ "${seen}" -gt 0 ]; then
              proceed=false
              reason="commit ${SHA:0:8} has already been handed to Jules"
            fi
          fi

          # --- Guard 2: the daily budget --------------------------------------
          # Counts distinct *commits*, not runs.
          #
          # A run in which guard 1 declines still concludes "success" — the
          # triage job did its work and only `fix` was skipped — so counting
          # runs charges the budget for handovers that never happened. On
          # 2026-09-07 commit 9895559 produced one real session from the CI
          # failure and one decline from the Container images failure, and the
          # decline was billed as if it were a second session. Two failing
          # workflows on one commit must cost one, which is the same thing
          # guard 1 already enforces.
          #
          # Runs predating `run-name:` carry no commit in their title; they fall
          # back to their own id so each still counts once.
          if [ "${proceed}" = "true" ]; then
            since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
            today=$(gh run list \
                      --workflow jules-ci-fix.yml \
                      --limit 100 \
                      --json createdAt,conclusion,databaseId,displayTitle \
                    | jq --arg since "${since}" \
                         --argjson me "${GITHUB_RUN_ID}" '
                        [ .[]
                          | select(.createdAt > $since
                                   and .databaseId != $me
                                   and .conclusion != null
                                   and (.conclusion | IN("skipped", "cancelled") | not))
                          | (.displayTitle | [scan("[0-9a-f]{40}")] | first)
                            // ("run-" + (.databaseId | tostring))
                        ] | unique | length' \
                    2>/dev/null || echo 0)
            echo "Commits handed over in the last 24h: ${today} (max ${DAILY_MAX})"
            if [ "${today}" -ge "${DAILY_MAX}" ]; then
              proceed=false
              reason="daily budget of ${DAILY_MAX} handovers is spent"
            fi
          fi

          # --- Guard 3: is Jules already working on this branch? --------------
          # Scoped to the branch that broke. `baseRefName` was fetched but never
          # tested, so an open Jules pull request anywhere in the repository
          # blocked a handover for every other branch — the opposite failure to
          # guard 1's, and just as silent.
          if [ "${proceed}" = "true" ] && [ -n "${BRANCH:-}" ]; then
            open=$(gh pr list --state open --limit 100 \
                     --json author,baseRefName \
                     --jq "[.[] | select(.baseRefName == \"${BRANCH}\" and
                                         (.author.login | test(\"jules\"; \"i\")))] | length" \
                   2>/dev/null || echo 0)
            if [ "${open}" -gt 0 ]; then
              proceed=false
              reason="Jules already has ${open} open pull request(s) against ${BRANCH}; let them land first"
            fi
          fi

          if [ "${proceed}" = "true" ]; then
            echo "Proceeding."
          else
            echo "::notice::Not handing this failure over: ${reason}."
            {
              echo "### Skipped"
              echo
              echo "Not handed to Jules: ${reason}."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "proceed=${proceed}" >> "$GITHUB_OUTPUT"

  fix:
    needs: triage
    if: needs.triage.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Collect the failing jobs
        id: failures
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: |
          set -euo pipefail
          # Job and step names only. Full logs run to megabytes and would swamp
          # the prompt; Jules can reproduce the build itself, which is better
          # evidence than a log it cannot re-run.
          gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure") |
                  "- \(.name): failed at step \"" +
                  ([.steps[] | select(.conclusion == "failure") | .name] | join(", ")) +
                  "\""' \
            > failures.txt || true

          if [ ! -s failures.txt ]; then
            echo "No failing jobs found in run ${RUN_ID}."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            cat failures.txt
            {
              echo "found=true"
              # Carried as an output, not left in a file. The Jules action runs
              # actions/checkout internally, and checkout cleans the workspace
              # (git clean -ffdx), so anything written here is gone by the time
              # a later step looks for it.
              delimiter="EOF_$(openssl rand -hex 12)"
              echo "list<<${delimiter}"
              cat failures.txt
              echo "${delimiter}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble the prompt
        id: prompt
        if: steps.failures.outputs.found == 'true'
        env:
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name || 'CI' }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          {
            echo "The \"${WORKFLOW}\" workflow for ${REPO} failed on branch ${BRANCH}."
            echo
            echo "Commit: ${SHA}"
            echo "Run: ${RUN_URL}"
            echo
            echo "Failing jobs:"
            cat failures.txt
            echo
            echo "Read AGENTS.md before you change anything. Section 3 lists the"
            echo "known build blockers; section 7 explains what each CI job does."
            echo
            cat <<'GUIDANCE'
          You are responsible for the health of this repository's Actions tab.
          The goal is a green build that means something — not a green tick.

          ## How to work

          1. Reproduce the failure. Run the same commands the failing job runs
             and show the actual output. Do not theorise from the job name.
          2. Establish whether this is a *new* breakage or one of the known
             blockers in AGENTS.md section 3.
          3. Fix the root cause. If the fix is large, fix one layer completely
             rather than half-fixing three.
          4. Re-run the build and the tests, and report the real result.

          ## What is not allowed

          Do not make CI green by weakening it. Specifically, do not:

          - disable, skip or delete a failing test
          - add `continue-on-error` to a job or step
          - lower a compiler warning level, or remove `-Werror`
          - loosen or delete an assertion
          - narrow the platform matrix to drop a platform that fails
          - relax the `meta` job's artifact guard so a rejected file passes

          Any of those turns a real signal into a false one, which is worse than
          the red build you started with. If the honest answer is that this
          cannot be fixed in one session, say so, push what you have, and state
          exactly what is left. A clear handover is a good outcome.

          ## If the failure is in the hygiene job

          `meta` is the gate and it is expected to pass. If it is red, something
          in the change genuinely violates AGENTS.md section 5 — a build
          artifact, an absolute symlink, a lint error in `tools/`. Fix the
          offending file. Do not edit `tools/check_no_artifacts.py` to stop it
          reporting, unless you have established that the rule itself is wrong,
          in which case add a regression test proving the new behaviour is
          correct.

          ## This session is unattended

          Nothing started this run but a failing build, and no one is watching
          the session waiting to answer you. A question asked here does not get
          a reply — it ends the session with the work half done and the branch
          no better than it was. So do not ask which approach to take, and do
          not ask for permission or confirmation.

          Decide instead. Pick the approach the evidence supports, say in one
          line why you picked it over the alternative, and carry it through. If
          a choice genuinely needs a maintainer — it changes the licence, it
          deletes someone's branch, it needs a credential you do not have — do
          the rest of the work first, then write the question into the pull
          request description under a heading "Needs a decision", where a human
          will actually see it.

          ## Pull request

          Open one pull request with the fix. Explain the root cause, the fix,
          and how you verified it. State plainly anything you could not verify.
          Push it even when the work is incomplete: a branch with two of five
          jobs fixed and an honest account of the other three is worth more
          than an unpushed session.
          GUIDANCE
          } > prompt.txt

          delimiter="EOF_$(openssl rand -hex 12)"
          {
            echo "text<<${delimiter}"
            cat prompt.txt
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Hand the failure to Jules
        if: steps.failures.outputs.found == 'true'
        uses: google-labs-code/jules-action@bff7875eaa123cac6742b7cfc51005b95ba4d566 # v1.0.0
        with:
          prompt: ${{ steps.prompt.outputs.text }}
          # Fix it on the branch that broke, not on the default branch.
          starting_branch: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          jules_api_key: ${{ secrets.JULES_API_KEY }}

      - name: Record the handover
        if: steps.failures.outputs.found == 'true'
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          FAILURES: ${{ steps.failures.outputs.list }}
        run: |
          {
            echo "### Handed to Jules"
            echo
            echo "Branch: \`${BRANCH}\`"
            echo
            echo "Failing run: ${RUN_URL}"
            echo
            printf '%s\n' "${FAILURES}"
          } >> "$GITHUB_STEP_SUMMARY"
